name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare artifact (copy CNAME into files/ so custom domain is preserved)
        run: |
          if [ -d "files" ]; then
            if [ -f CNAME ]; then
              cp -f CNAME files/
            fi
          else
            echo "ERROR: files/ directory not found"
            exit 1
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'files'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
